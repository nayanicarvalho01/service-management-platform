services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: service_platform
      POSTGRES_USER: customers_app
      POSTGRES_PASSWORD: customers_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customers_app -d service_platform"]
      interval: 5s
      timeout: 3s
      retries: 10

  customers:
    build: ./customers
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/service_platform?currentSchema=customers
      SPRING_DATASOURCE_USERNAME: customers_app
      SPRING_DATASOURCE_PASSWORD: customers_local
    depends_on:
      postgres:
        condition: service_healthy

  appointment:
    build: ./appointment
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/service_platform?currentSchema=appointments
      SPRING_DATASOURCE_USERNAME: customers_app
      SPRING_DATASOURCE_PASSWORD: customers_local
      CLIENTS_CUSTOMER_SERVICE_BASE_URL: http://customers:8080
    depends_on:
      postgres:
        condition: service_healthy
      customers:
        condition: service_started

volumes:
  postgres_data: